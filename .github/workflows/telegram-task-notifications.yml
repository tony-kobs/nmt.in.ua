name: Telegram task notifications

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: telegram-task-notifications
  cancel-in-progress: false

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process notifications
        env:
          TRIGGER_SECRET: ${{ secrets.TELEGRAM_NOTIFICATIONS_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${TRIGGER_SECRET//[[:space:]]/}" ]; then
            echo "Missing notification trigger secret." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          const deadline = Date.now() + 240_000;
          let cursor = 0;
          let errors = false;
          while (Date.now() + 60_000 <= deadline) {
            const response = await fetch(
              'https://nmt.in.ua/api/telegram/notifications/process?afterAccountId=' + cursor,
              { method: 'POST', headers: { authorization: 'Bearer ' + process.env.TRIGGER_SECRET },
                signal: AbortSignal.timeout(60_000) },
            );
            if (!response.ok) throw new Error('Notification trigger returned HTTP ' + response.status);
            const result = await response.json();
            const keys = ['sent', 'skipped', 'failed', 'rejected', 'uncertain', 'processedAccounts'];
            if (!keys.every(key => Number.isSafeInteger(result[key]) && result[key] >= 0)
                || typeof result.complete !== 'boolean') throw new Error('Invalid notification result');
            console.log(Object.fromEntries([...keys, 'complete', 'nextCursor'].map(key => [key, result[key]])));
            errors ||= Boolean(result.failed || result.rejected || result.uncertain);
            if (result.complete) process.exit(errors ? 1 : 0);
            if (!Number.isSafeInteger(result.nextCursor) || result.nextCursor <= cursor) {
              throw new Error('Invalid notification continuation');
            }
            cursor = result.nextCursor;
          }
          throw new Error('Notification sweep incomplete; resume with afterAccountId=' + cursor);
          NODE
