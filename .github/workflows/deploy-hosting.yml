# Merge to main → build here (modern glibc) → hosting only swaps the release.
# Do not build Next on ukraine.com.ua. Do not use SCP / appleboy.
name: Deploy hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require panel API secrets
        env:
          ADM_TOOLS_TOKEN: ${{ secrets.ADM_TOOLS_TOKEN }}
          ADM_TOOLS_HOST_ID: ${{ secrets.ADM_TOOLS_HOST_ID }}
        run: |
          if [ -z "$ADM_TOOLS_TOKEN" ] || [ -z "$ADM_TOOLS_HOST_ID" ]; then
            echo "Add repo secrets ADM_TOOLS_TOKEN and ADM_TOOLS_HOST_ID." >&2
            echo "The panel Node manager restarts the site. This job does not nohup its own copy." >&2
            exit 1
          fi
          case "$ADM_TOOLS_HOST_ID" in
            *[!0-9]*)
              echo "ADM_TOOLS_HOST_ID must be digits (site host_id)." >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install, test, lint, build
        env:
          NEXT_PUBLIC_SITE_URL: https://nmt.in.ua
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          if [ -z "${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}" ]; then
            echo "::warning::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is empty. Each build mints a new Server Action key, so a tab opened before deploy can 500. Add a secret from: openssl rand -base64 32"
          else
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$(printf '%s' "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" | tr -d '\n\r')"
            export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
            bytes="$(printf '%s' "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" | base64 -d 2>/dev/null | wc -c | tr -d ' ')"
            case "$bytes" in
              16|24|32) echo "Server Action encryption key length ok (${bytes} bytes)." ;;
              *)
                echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY must be base64 for 16, 24, or 32 bytes (decoded ${bytes})." >&2
                exit 1
                ;;
            esac
          fi
          npm ci
          npm test
          npm run lint
          npm run build
          bash scripts/rewrite-next-build-paths.sh

      - name: Write SSH key
        env:
          HOSTING_SSH_KEY: ${{ secrets.HOSTING_SSH_KEY }}
        run: |
          if [ -z "$HOSTING_SSH_KEY" ]; then
            echo "Add repo secret HOSTING_SSH_KEY (private key for levelhst@levelhst.ftp.tools)." >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$HOSTING_SSH_KEY" > "$HOME/.ssh/hosting_key"
          chmod 600 "$HOME/.ssh/hosting_key"
          ssh-keyscan -H levelhst.ftp.tools >> "$HOME/.ssh/known_hosts"

      # Host runs npm install, then npm run migrate, then stops the legacy
      # listener, swaps www, and asks the panel to reload Node.
      - name: Upload release, migrate, then swap www
        env:
          RELEASE_ID: ${{ github.sha }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          ADM_TOOLS_TOKEN: ${{ secrets.ADM_TOOLS_TOKEN }}
          ADM_TOOLS_HOST_ID: ${{ secrets.ADM_TOOLS_HOST_ID }}
        run: |
          export SSH_KEY="$HOME/.ssh/hosting_key"
          if [ -n "${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}" ]; then
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$(printf '%s' "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" | tr -d '\n\r')"
            export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
          fi
          bash scripts/deploy-hosting.sh --skip-build
