# Posts a Discord embed when a GitHub release is published.
# workflow_dispatch input `tag` re-posts an existing release via `gh release view`.
# DISCORD_WEBHOOK is a repository secret. Never print it.
#
# The embed is built by scripts/discord-release.sh, the same script Release
# uses after a confirmed production deploy. A release created with the
# default GITHUB_TOKEN does not trigger this workflow, so Release posts to
# Discord itself and this file does not double-post that release.

name: Release Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег наявного релізу, наприклад v1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  discord:
    name: Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - name: Check Discord webhook
        id: webhook
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::warning::DISCORD_WEBHOOK is empty; skipping Discord notification."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: ${{ success() && steps.webhook.outputs.skip != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || format('refs/heads/{0}', github.event.repository.default_branch) }}
          persist-credentials: false
          fetch-depth: 1

      - name: Post release embed
        if: ${{ success() && steps.webhook.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(mktemp)"
          cleanup() {
            rm -f "$release_json"
          }
          trap cleanup EXIT

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG:-}"
            tag="${tag#"${tag%%[![:space:]]*}"}"
            tag="${tag%"${tag##*[![:space:]]}"}"
            if [ -z "$tag" ] || [[ "$tag" =~ [[:space:]] ]]; then
              echo "::error::Release tag is empty or contains whitespace."
              exit 1
            fi
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json tagName,name,body,url > "$release_json"
          else
            jq '{
              tagName: .release.tag_name,
              name: .release.name,
              body: .release.body,
              url: .release.html_url
            }' "$GITHUB_EVENT_PATH" > "$release_json"
          fi

          bash scripts/discord-release.sh "$release_json"
