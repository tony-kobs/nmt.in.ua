name: Marathon notifications cron

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: marathon-cron
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Process marathon notifications
        run: |
          curl -fsS --max-time 70 -X POST -H "Authorization: Bearer ${{ secrets.MARATHON_CRON_SECRET }}" https://nmt.in.ua/api/marathon/notifications/process
