# Запис PR у dev комітиться в гілку цього PR, не в dev.
# Push цього коміта йде від GITHUB_TOKEN. Подія pull_request:synchronize
# від такого токена лишає запуск без jobs (схвалення воркфлоу) і червоний
# хрестик на PR, тож synchronize тут немає. Нові коміти людини ловить push:
# push від GITHUB_TOKEN воркфлоу не стартує. Якщо колись стартує, job і так
# відсікає github-actions[bot].
# PR лише з цими двома файлами не переписує журнал (paths-ignore).
# Журнал пишеться лише в docs/changelog.md. Вказівник гіда дія більше не чіпає.
# Новини релізу (PR dev → main) комітяться прямо в dev від github-actions[bot].
# Окремої гілки і pull request немає. Коміт: «docs: новини релізу #N [skip ci]».
# Якщо push у dev не пройшов, job падає. Гілку і pull request не створює.
# Старі гілки changelog/* лишаються в branches-ignore, щоб не будити цей workflow.
name: Changelog

on:
  pull_request:
    types: [opened, reopened, edited]
    branches: [dev, main]
    paths-ignore:
      - docs/changelog.md
      - docs/nmt-in-ua-onboarding-dev.md
  push:
    branches-ignore:
      - main
      - changelog/**

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  record:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'changelog/') &&
      github.actor != 'github-actions[bot]') ||
      (github.event_name == 'push' &&
      github.ref != 'refs/heads/dev' &&
      github.ref != 'refs/heads/main' &&
      !startsWith(github.ref, 'refs/heads/changelog/') &&
      github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: dev
        run: |
          write_env() {
            local name="$1"
            local value="$2"
            local delim="DELIM_${name}_$$"
            {
              printf '%s<<%s\n' "$name" "$delim"
              printf '%s\n' "$value"
              printf '%s\n' "$delim"
            } >> "$GITHUB_ENV"
          }

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            number="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
            title="$(jq -r '.pull_request.title // empty' "$GITHUB_EVENT_PATH")"
            url="$(jq -r '.pull_request.html_url // empty' "$GITHUB_EVENT_PATH")"
            body="$(jq -r '.pull_request.body // empty' "$GITHUB_EVENT_PATH")"
            author="$(jq -r '.pull_request.user.login // empty' "$GITHUB_EVENT_PATH")"
            updated="$(jq -r '.pull_request.updated_at // empty' "$GITHUB_EVENT_PATH")"
            head="$(jq -r '.pull_request.head.ref // empty' "$GITHUB_EVENT_PATH")"
          else
            json="$(gh pr list --repo "$REPO" --head "$GITHUB_REF_NAME" --base "$BASE" --state open --limit 1 --json number,title,url,body,author,updatedAt)"
            number="$(printf '%s' "$json" | jq -r '.[0].number // empty')"
            if [ -z "$number" ]; then
              echo "No open pull request into ${BASE} for ${GITHUB_REF_NAME}."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            title="$(printf '%s' "$json" | jq -r '.[0].title // empty')"
            url="$(printf '%s' "$json" | jq -r '.[0].url // empty')"
            body="$(printf '%s' "$json" | jq -r '.[0].body // empty')"
            author="$(printf '%s' "$json" | jq -r '.[0].author.login // empty')"
            updated="$(printf '%s' "$json" | jq -r '.[0].updatedAt // empty')"
            head="$GITHUB_REF_NAME"
          fi

          write_env PR_NUMBER "$number"
          write_env PR_TITLE "$title"
          write_env PR_URL "$url"
          write_env PR_BODY "$body"
          write_env PR_AUTHOR "$author"
          write_env MERGED_AT "$updated"
          write_env HEAD_REF "$head"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          echo "Pull request #${number}"

      - name: Checkout the pull request branch
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}

      - name: Setup Node
        if: steps.pr.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Record the pull request
        if: steps.pr.outputs.found == 'true'
        env:
          TARGET: dev
          COMMENT_PATH: changelog-comment.txt
        run: node scripts/record-changelog.mjs

      - name: Commit journal onto the pull request branch
        if: steps.pr.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.md
          if git diff --cached --quiet; then
            echo "Journal already matches this pull request."
            exit 0
          fi
          git commit -m "docs: журнал змін з #${PR_NUMBER}"
          git pull --rebase origin "$HEAD_REF"
          git push origin "HEAD:${HEAD_REF}"

      - name: Remind about the screencast
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -s changelog-comment.txt ]; then
            exit 0
          fi
          if gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq '.[].body' | grep -F '<!-- changelog-screencast -->' >/dev/null; then
            rm -f changelog-comment.txt
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file changelog-comment.txt
          rm -f changelog-comment.txt

  release-news:
    permissions:
      contents: write
      pull-requests: read
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: main
        run: |
          write_env() {
            local name="$1"
            local value="$2"
            local delim="DELIM_${name}_$$"
            {
              printf '%s<<%s\n' "$name" "$delim"
              printf '%s\n' "$value"
              printf '%s\n' "$delim"
            } >> "$GITHUB_ENV"
          }

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            number="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
            title="$(jq -r '.pull_request.title // empty' "$GITHUB_EVENT_PATH")"
            url="$(jq -r '.pull_request.html_url // empty' "$GITHUB_EVENT_PATH")"
            body="$(jq -r '.pull_request.body // empty' "$GITHUB_EVENT_PATH")"
            author="$(jq -r '.pull_request.user.login // empty' "$GITHUB_EVENT_PATH")"
            updated="$(jq -r '.pull_request.updated_at // empty' "$GITHUB_EVENT_PATH")"
          else
            json="$(gh pr list --repo "$REPO" --head dev --base "$BASE" --state open --limit 1 --json number,title,url,body,author,updatedAt)"
            number="$(printf '%s' "$json" | jq -r '.[0].number // empty')"
            if [ -z "$number" ]; then
              echo "No open pull request from dev into ${BASE}."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            title="$(printf '%s' "$json" | jq -r '.[0].title // empty')"
            url="$(printf '%s' "$json" | jq -r '.[0].url // empty')"
            body="$(printf '%s' "$json" | jq -r '.[0].body // empty')"
            author="$(printf '%s' "$json" | jq -r '.[0].author.login // empty')"
            updated="$(printf '%s' "$json" | jq -r '.[0].updatedAt // empty')"
          fi

          write_env PR_NUMBER "$number"
          write_env PR_TITLE "$title"
          write_env PR_URL "$url"
          write_env PR_BODY "$body"
          write_env PR_AUTHOR "$author"
          write_env MERGED_AT "$updated"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Release pull request #${number}"

      - name: Checkout dev
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node
        if: steps.pr.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect news for the release
        if: steps.pr.outputs.found == 'true'
        env:
          TARGET: main
        run: node scripts/record-changelog.mjs

      - name: Commit release news onto dev
        if: steps.pr.outputs.found == 'true'
        run: |
          # Прямо в dev. Окремої гілки і pull request немає.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.md
          if git diff --cached --quiet; then
            echo "No news to publish."
            exit 0
          fi
          git commit -m "docs: новини релізу #${PR_NUMBER} [skip ci]"

          fail_push() {
            local detail="$1"
            echo "$detail"
            echo "::error::${detail} Окрему гілку не створюю і pull request не відкриваю."
            exit 1
          }

          is_non_fast_forward() {
            grep -E -q 'non-fast-forward|rejected because the remote contains work|tip of your current branch is behind' "$1"
          }

          refresh_dev() {
            local refspec="+refs/heads/dev:refs/remotes/origin/dev"
            if [ -f "$(git rev-parse --git-path shallow)" ]; then
              git fetch --unshallow --no-tags origin "$refspec"
            else
              git fetch --no-tags origin "$refspec"
            fi
          }

          attempt=1
          while [ "$attempt" -le 3 ]; do
            err="$(mktemp)"
            if git push origin "HEAD:dev" >"$err" 2>&1; then
              echo "Pushed release news onto dev."
              exit 0
            fi
            cat "$err"
            if ! is_non_fast_forward "$err"; then
              fail_push "Не вдалося записати новини релізу #${PR_NUMBER} прямо в dev. Якщо гілка захищена, GitHub відхилив push від github-actions[bot]."
            fi
            if [ "$attempt" -eq 3 ]; then
              fail_push "Не вдалося записати новини релізу #${PR_NUMBER} у dev: тричі не вийшов fast-forward."
            fi
            echo "dev moved (attempt ${attempt}/3). Fetch and rebase."
            if ! refresh_dev; then
              fail_push "Не вдалося підтягнути свіжий dev для новин релізу #${PR_NUMBER}."
            fi
            if ! git rebase origin/dev; then
              git rebase --abort || true
              fail_push "Не вдалося перебазувати новини релізу #${PR_NUMBER} на свіжий dev."
            fi
            attempt=$((attempt + 1))
          done
          fail_push "Не вдалося записати новини релізу #${PR_NUMBER} прямо в dev."
